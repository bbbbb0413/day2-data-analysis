#=============================================================================
# NYC Yellow Taxi 정제 파이프라인 설정
#
# 임계값을 코드가 아니라 이 파일에 모아 둔 이유:
#   1) 기준 변경이 diff 한 줄로 드러난다. 코드에 상수를 박아 두면 로직 수정과
#      값 조정이 같은 커밋에 뒤섞여 "왜 숫자가 달라졌는지" 추적이 안 된다.
#   2) 스케줄러가 월별·환경별로 다른 설정 파일을 넘길 수 있다.
#      (예: 2026-06 처리 시 --config config/pipeline-2026-06.toml)
#   3) 설정 해시를 실행 기록에 남길 수 있어, 과거 산출물이 어떤 기준으로
#      만들어졌는지 재현 가능하다.
#
# 각 값의 근거는 결측치_중복_처리기준.md 의 표시된 절에 있다.
#=============================================================================

[project]
name  = "nyc-taxi-eda"
month = "2026-05"          # 이 파일이 담아야 할 기간 (§4 기간 이탈 판정 기준)

#-----------------------------------------------------------------------------
# 원본 데이터 출처 — 없으면 여기서 내려받는다
#
# "먼저 파일을 수동으로 넣어두세요"는 자동화의 실패 지점이다. 스케줄러가 새 서버나
# 새 컨테이너에서 돌면 아무도 파일을 넣어주지 않는다. 입력 확보까지 파이프라인이
# 책임지면 저장소만 있으면 어디서든 실행된다.
#
# url_template의 {month}는 위 project.month로 치환된다. 다른 달을 처리할 때
# month 하나만 바꾸면 경로와 URL이 함께 따라간다.
#-----------------------------------------------------------------------------
[source]
url_template = "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{month}.parquet"
# true  : 파일이 없으면 자동으로 내려받는다 (이미 있으면 건드리지 않음)
# false : 없을 때 받지 않고 안내와 함께 실패한다.
#         네트워크가 막힌 환경에서 조용히 멈춰 있는 것보다 명확히 실패하는 편이 낫다.
auto_download = true
timeout_sec = 120

#-----------------------------------------------------------------------------
# 경로 — 모두 프로젝트 루트 기준 상대경로. 실행 위치와 무관하게 동작한다.
#-----------------------------------------------------------------------------
[paths]
raw       = "data/raw/yellow_tripdata_{month}.parquet"   # {month}는 project.month로 치환된다
interim   = "data/interim"     # --checkpoint 시 단계별 중간 산출물
processed = "data/processed"   # 최종 정제 결과
runs      = "outputs/runs"     # 실행별 메트릭·매니페스트·리포트

#-----------------------------------------------------------------------------
# 컬럼 역할 정의 — 컬럼명이 바뀌어도 코드를 고치지 않는다
#-----------------------------------------------------------------------------
[columns]
pickup  = "tpep_pickup_datetime"
dropoff = "tpep_dropoff_datetime"
vendor  = "VendorID"

# 결측이 100% 동시 발생하는 5개 컬럼 (§2.2 — 일부만 결측인 행이 0건)
missing_group = [
    "passenger_count", "RatecodeID", "store_and_fwd_flag",
    "congestion_surcharge", "Airport_fee",
]
# 결측 판정 대표 컬럼. 위 5개가 완전히 같은 행에서 비므로 하나면 충분하다.
missing_flag = "congestion_surcharge"

# 총액 검산용 세부 항목 (§2.5 — fillna(0)이 틀렸다는 근거를 계산할 때 사용)
amount_parts = [
    "fare_amount", "extra", "mta_tax", "tip_amount", "tolls_amount",
    "improvement_surcharge", "Airport_fee", "cbd_congestion_fee",
]

categorical = ["VendorID", "payment_type", "RatecodeID", "passenger_count",
               "is_rush_hour", "is_airport_trip"]

#-----------------------------------------------------------------------------
# 중복 판정 (§3)
#-----------------------------------------------------------------------------
[duplicates]
# 키 폭을 넓히며 관측한 결과 (§3.2):
#     시각 2개만        → 33,925건 (우연 충돌 섞임)
#     시각 2개 + 존 2개 → 29,401건  ★ 채택
#     + 거리 + 총액     →      0건 (중복 후보의 금액이 서로 달라 탐지 불가)
# 귀무모형으로 우연 가능성 배제 (§3.3): 무작위 재배치 시 기대 2건 → 관측 14,700배
key = ["tpep_pickup_datetime", "tpep_dropoff_datetime", "PULocationID", "DOLocationID"]

# ① 상쇄쌍: 그룹 두 행의 total_amount 합이 0 → 취소·환불로 장부상 상쇄.
#    부동소수 오차만 흡수하면 되므로 1센트 미만으로 잡는다.
void_tolerance = 0.01

# ② 이중계상: total_amount만 정확히 2배 → 큰 쪽이 이중 계상된 행.
#    16,086쌍 전부 양쪽 payment_type=0. 동일 포맷 단독행의 total/fare
#    중앙값 1.231 대비 큰 쪽은 2.785로 완전히 이탈한다 (§3.4).
double_ratio_min = 1.99
double_ratio_max = 2.01

#-----------------------------------------------------------------------------
# 위장 결측 (§2.6) — isna()에 안 잡히지만 실질적으로 결측인 값
# 그냥 두면 payment_type 평균 같은 집계가 조용히 오염된다. 합계 약 114만 건.
#-----------------------------------------------------------------------------
[sentinels]
payment_type    = [0]        # TLC 코드북에 없는 값 (955,371건, 전부 결측행)
RatecodeID      = [99]       # TLC 정의상 "Unknown" (140,897건)
passenger_count = [0]        # 0명 탑승은 물리적으로 불가 (12,533건)
PULocationID    = [264, 265] # 264=Unknown, 265=구역 외 (6,486건)
DOLocationID    = [264, 265] # 〃 (21,726건)

#-----------------------------------------------------------------------------
# 이상치 (§4)
#-----------------------------------------------------------------------------
[outliers]
# 소요시간 상한 6시간: 상위 99.9%가 7,750초(2.15시간)이므로 매우 관대한 상한이다.
# 장거리 공항 운행을 살리려는 선택이며, 최댓값 166시간 같은 오기록만 걸러낸다.
duration_min_sec = 1
duration_max_sec = 21600
# 거리 상한 100마일: 최댓값 307,491마일(지구 12바퀴)은 명백한 오기록.
distance_min = 0.01
distance_max = 100.0

# ################################################################################
# "거리 99mile + 시간 2초" 같은 물리적으로 불가능한 조합을 못 걸러낸다.
# 뉴욕은 정체가 심해 하한은 두지 않는다(정체 구간 저속 운행까지 지워질 위험이
# 있어서, GPS 오류를 잡는 상한만 둔다). 실제 필터: taxi_pipeline/steps/outliers.py
# ################################################################################
speed_max_kmh = 200.0

# ★ 소요시간 규칙은 VendorID=7을 전량(51,750건) 제거한다 (§4 보완, §6-5).
#   그 사업자는 하차시각을 승차시각과 같게 기록하기 때문이다.
#   drop = 문서 기준 그대로 제거 / flag = duration_valid 컬럼만 달고 행은 보존
#   운행량·요금·존 분석이 목적이면 flag 로 바꾼다.
duration_policy = "drop"

#-----------------------------------------------------------------------------
# 품질 게이트 — 자동화의 핵심.
# 스케줄러는 로그를 읽지 않는다. 기대와 다르면 프로세스가 0이 아닌 코드로
# 죽어야 알림이 울린다. 아래 값과 다르면 파이프라인이 실패로 끝난다.
#-----------------------------------------------------------------------------
[expectations]
# exact 항목을 검사할지 여부. 다른 월을 돌릴 때는 false 로 둔다.
# ★ TOML은 하위 테이블([expectations.exact])이 열리면 그 뒤의 키가 모두
#   하위 테이블에 속한다. 그래서 이 값은 반드시 하위 테이블보다 '위'에 있어야 한다.
check_exact = true

# 정확히 일치해야 하는 값 (2026-05 기준 데이터)
[expectations.exact]
total_rows       = 4090836
missing_rows     = 955371
exact_duplicates = 0
duplicate_groups = 29401
void_pairs       = 13301
double_rows      = 16086
final_rows       = 3884062

# 범위로만 검사하는 값 — 다른 월 데이터에도 적용 가능한 일반 규칙
[expectations.range]
retention_ratio  = { min = 0.90, max = 1.00 }   # 과도한 삭제 방지
missing_ratio    = { min = 0.00, max = 0.40 }   # 결측 급증 감지
negative_total   = { min = 0, max = 0 }         # 정제 후 음수 총액은 0이어야 한다

#-----------------------------------------------------------------------------
# 시각화 (문서 02_시각화_근거.md)
#-----------------------------------------------------------------------------
[visualize]
# 한글 폰트 후보. 설치된 것 중 처음 발견되는 것을 쓴다.
# 지정하지 않으면 한글 제목·축 레이블이 두부(□□□)로 깨져 그림을 읽을 수 없다.
# AppleGothic은 macOS 전용이라 다른 OS 대비 후보를 여러 개 둔다.
font_candidates = ["AppleGothic", "Apple SD Gothic Neo", "NanumGothic", "Malgun Gothic"]

# 리포트 임베드용 해상도. 300dpi는 파일만 커지고 화면에서는 차이가 없다.
dpi = 120
figsize = [10, 6]

# 차트1 x축 상한. 20 mile 이하가 전체의 99.2%를 차지한다.
# 최댓값 99.66까지 그리면 막대가 왼쪽 끝에 뭉쳐 아무것도 보이지 않는다.
distance_xlim = 20


#-----------------------------------------------------------------------------
# 통계분석 (문서 03_통계분석_근거.md)
#-----------------------------------------------------------------------------
[statistics]
alpha = 0.05          # 유의수준

# Welch's t-test. ttest_ind 기본값은 equal_var=true(등분산 가정)인데,
# 분산비가 가설별로 1.06~1.80배로 갈려 등분산이 성립하지 않는 가설이 있다.
# Welch는 등분산일 때도 Student와 사실상 같은 결과를 주므로 일괄 적용한다(§S-5).
equal_var = false

# 기술통계 대상. 분위수에 중앙값(50%)이 포함되어 평균과 나란히 놓인다.
# 평균이 중앙값의 1.8배인 분포라 표준편차만으로는 비대칭을 알 수 없다.
# speed_kmh 추가 — filter_outliers 단계(§4)에서 이미 만들어진
# 파생변수라 describe/correlation 대상에 넣기만 하면 됨(계산 로직은 안 건드림)
describe_columns = ["trip_distance", "fare_amount", "tip_amount", "total_amount", "speed_kmh"]
percentiles = [0.25, 0.50, 0.75, 0.95, 0.99]

# 상관계수 대상. 피어슨과 스피어만을 둘 다 계산해 격차를 드러낸다.
correlation_columns = ["trip_distance", "fare_amount", "tip_amount", "total_amount", "speed_kmh"]

# t-test 집단 경계(mile). 임의로 정한 값이므로 바꾸면 결과도 달라진다.
long_trip_threshold = 5.0


# 신규 단계 게이트 (문서 02 §4, 03 §5)
# 차트·검정이 조용히 누락되면 리포트만 비어 나오고 종료 코드는 0이 된다.
# 발표가 없어 리포트가 유일한 전달 수단이므로 반드시 실패로 잡아야 한다.
[expectations.range.figure_count]
min = 10
max = 12
# t-test 효과크기. 정확값 대신 범위로 검사해 다른 달 데이터에서도 통하게 한다.
[expectations.range.cohens_d]
min = 0.5
max = 1.0

#-----------------------------------------------------------------------------
# ML Pipeline (문서 04_ML파이프라인_근거.md)
# 타깃·모집단·표본 크기는 STEP 1에서 데이터로 확정한 값이다.
#-----------------------------------------------------------------------------
[model]
# 고액팁 임계값. 25%면 양성 56.13%로 클래스가 균형에 가깝다.
# 15%로 낮추면 양성이 78.7%가 되어 "전부 양성" 모델이 정확도 0.79로
# 실제 모델(0.77)을 이긴다 — 지표가 뒤집힌다.
target_tip_rate = 0.25

# 카드결제 한정. 현금·무료·분쟁 결제는 팁이 100% 0으로 기록되므로
# 섞으면 모델이 '결제수단 맞히기'를 하게 된다.
payment_type = 1

# 층화 추출 크기. 전체 266만 대비 ROC-AUC는 +0.0005 오르는 데 그치고
# 학습 시간은 5.7배(3.9초 → 22.3초) 늘어난다.
train_sample = 500000
test_size = 0.2
random_state = 42

# 범주형 희귀값 병합 기준. 존이 255개라 제한 없이 원-핫하면
# 509컬럼(밀집 10.1GB)이 되어 학습이 불가능하다. 0.5%면 100컬럼으로 줄어든다.
min_frequency = 0.005

# F1 상한을 두는 이유: 0.95를 넘으면 성능이 좋은 게 아니라 누수 의심 신호다.
[expectations.range.f1]
min = 0.70
max = 0.95
[expectations.range.train_rows]
min = 100000
max = 2000000
